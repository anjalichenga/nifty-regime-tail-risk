[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-stress"
version = "0.1.0"
description = "Market Regime Detection & Tail-Risk Forecasting Framework (NIFTY 50)"
authors = [{ name = "Senior Quant & ML Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "arch>=7.0.0",
    "scikit-learn>=1.5.0",
    "hmmlearn>=0.3.2",
    "ruptures>=1.1.9",
    "yfinance==1.7.0",
    "plotly>=5.22.0",
    "streamlit>=1.36.0",
    "matplotlib>=3.9.0",
    "pyarrow>=16.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
extend-ignore = ["BLE001", "S110", "S112", "F401"]

[tool.mypy]
ignore_missing_imports = true
